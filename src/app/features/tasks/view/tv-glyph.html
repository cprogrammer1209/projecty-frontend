@switch (icon().k) {
  @case ('status') {
    <svg [attr.width]="size()" [attr.height]="size()" viewBox="0 0 14 14" aria-hidden="true">
      <circle cx="7" cy="7" r="5.6" fill="none" [attr.stroke]="color()" stroke-width="1.5" [attr.stroke-dasharray]="dashed() ? '2.2 1.9' : null" />
      @if (closed()) {
        <circle cx="7" cy="7" r="6.3" [attr.fill]="color()" />
        <path d="M4.4 7.2L6.2 9l3.4-3.6" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      } @else if (half()) {
        <path d="M7 3.6a3.4 3.4 0 0 1 0 6.8z" [attr.fill]="color()" />
      }
    </svg>
  }
  @case ('prio') {
    <svg [attr.width]="size()" [attr.height]="size()" viewBox="0 0 14 14" aria-hidden="true">
      @if (prio() === 'CRITICAL') {
        <rect x="1" y="1" width="12" height="12" rx="3" fill="#f2711c" />
        <path d="M7 3.8v4M7 9.6v.8" stroke="#fff" stroke-width="1.6" stroke-linecap="round" />
      } @else if (prio() === 'NONE') {
        <path d="M2 7h2.5M5.8 7h2.4M9.5 7H12" stroke="#9a9da6" stroke-width="1.6" stroke-linecap="round" />
      } @else {
        @for (b of bars(); track b.x) {
          <rect [attr.x]="b.x" [attr.y]="b.y" width="2.4" [attr.height]="b.h" rx=".8" [attr.fill]="b.on ? 'var(--py-ink)' : 'var(--py-border-control)'" [attr.opacity]="b.on ? null : 0.4" />
        }
      }
    </svg>
  }
  @case ('ui') { <py-tv-icon [n]="ui()" [size]="size()" /> }
  @case ('person') { <py-tv-avatar [name]="person()" [size]="size()" /> }
  @case ('tag') { <span class="tag-dot"></span> }
}
